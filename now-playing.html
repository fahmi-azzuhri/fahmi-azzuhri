<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c211f" />
    <title>Now Playing | Fahmi Azzuhri</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        background: #edf2ee;
        color: #e9f3ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        place-items: center;
        background:
          radial-gradient(
            ellipse at 18% 15%,
            rgb(123 174 153 / 15%),
            transparent 36%
          ),
          linear-gradient(145deg, #f4f6f2, #e5ece7);
      }

      .player {
        display: grid;
        width: min(920px, 100%);
        grid-template-columns: minmax(180px, 260px) minmax(0, 1fr);
        gap: 30px;
        align-items: center;
        padding: 18px;
        overflow: hidden;
        border: 1px solid #49605b;
        border-radius: 8px;
        background: linear-gradient(
          115deg,
          #091b19 0%,
          #102c29 58%,
          #123b3b 100%
        );
        box-shadow:
          0 22px 55px rgb(16 48 41 / 18%),
          inset 0 1px rgb(255 255 255 / 8%);
        animation: arrive 600ms ease-out both;
      }

      .cover {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 5px;
        object-fit: cover;
        box-shadow: 0 8px 24px rgb(0 0 0 / 28%);
      }

      .details {
        min-width: 0;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #8fd5c4;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #edf7f2;
        font-size: 34px;
        font-weight: 600;
        line-height: 1.12;
      }

      .artist {
        margin: 9px 0 24px;
        color: #85c5b9;
        font-size: 21px;
      }

      .album {
        margin: -14px 0 24px;
        color: #aec7be;
        font-size: 13px;
        line-height: 1.5;
      }

      .waveform {
        display: flex;
        height: 58px;
        gap: 4px;
        align-items: center;
        justify-content: center;
      }

      .waveform span {
        width: 5px;
        height: var(--height);
        flex: 0 1 7px;
        border-radius: 4px;
        background: linear-gradient(180deg, #a4dfd0, #328e88);
        opacity: 0.86;
      }

      .listen {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-top: 17px;
        padding: 0 17px;
        border: 1px solid rgb(143 213 196 / 42%);
        border-radius: 5px;
        color: #d9f3e9;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        transition:
          background-color 160ms ease,
          border-color 160ms ease;
      }

      .listen:hover,
      .listen:focus-visible {
        border-color: #a4dfd0;
        background: rgb(143 213 196 / 12%);
      }

      .play {
        width: 0;
        height: 0;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-left: 8px solid currentColor;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        body {
          padding: 18px;
        }

        .player {
          max-width: 390px;
          grid-template-columns: minmax(0, 1fr);
          gap: 22px;
          padding: 14px;
        }

        .cover {
          max-height: 300px;
        }

        .details {
          padding: 4px 8px 10px;
        }

        h1 {
          font-size: 30px;
        }

        .waveform {
          gap: 2px;
        }

        .waveform span {
          width: 4px;
          flex-basis: 4px;
        }

        .waveform span:nth-child(n + 49) {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
